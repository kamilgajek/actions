name: Check Python dependency policy
description: Check declared Python dependencies against policy.txt

runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'

    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        pip install --quiet packaging
        python "$ACTION_PATH/check.py" --root "$GITHUB_WORKSPACE"
